 */

plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Gunakan library Google Guava
    implementation 'com.google.guava:guava:31.1-jre'

    // Library untuk testing
    testImplementation 'junit:junit:4.13'

    // Default dependencies yang ditambahkan oleh gradle init
    api 'org.apache.commons:commons-math3:3.6.1'

    // Use JUnit test framework.
    testImplementation libs.junit

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api libs.commons.math3

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Mendefinisikan tugas khusus untuk menyapa dengan cara yang kompatibel dengan configuration cache
tasks.register('greetingTask') {
    description = 'Greets a user with a custom message'
    group = 'custom'

    // Definisikan properti yang akan menyimpan nilai nama
    // Ini dilakukan di fase konfigurasi
    def namaProperty = project.findProperty('nama') ?: 'Gradle User'

    doLast {
        // Gunakan properti yang telah didefinisikan sebelumnya
        println "Hello, ${namaProperty}! Welcome to Gradle World!"
    }
}